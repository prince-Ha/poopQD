# 게임을 빌드해서 GitHub Pages(https://prince-ha.github.io/poopQD/)에 배포
# 미리보기로 확인한 뒤 원할 때만 배포하도록 수동 실행만 받음
#   - Claude에게 "배포해줘"라고 하거나
#   - GitHub 저장소 Actions 탭 → 'GitHub Pages 배포' → Run workflow
name: GitHub Pages 배포

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
